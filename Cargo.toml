[package]
name = "squic"
version = "0.22.0"
edition = "2024"
description = "Shielded QUIC: silent server, key-pinned identity, runtime client whitelisting"
license = "MIT"

[dependencies]
quinn = { version = "0.11", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
getrandom = "0.3"
hex = "0.4"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
quinn-proto = "0.11"
socket2 = "0.5"
thiserror = "2"
x509-cert = { version = "0.2", default-features = false }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full", "test-util"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
futures = "0.3"

[[example]]
name = "sqperf"
path = "examples/sqperf.rs"

[[example]]
name = "http3"
path = "examples/http3.rs"

[[example]]
name = "quinn_perf"
path = "examples/quinn_perf.rs"

# Linux only, for one setsockopt: turning UDP_GRO back off. See `socket_state`
# in src/conn.rs for why squic declines coalescing rather than half-handling it.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Debug info is the bulk of a test binary on any target that embeds it — which
# is Linux, and so CI. Our own crates keep full symbols; dependencies drop to
# line tables, which still give file:line in a panic. macOS is unaffected
# either way: it defaults to split-debuginfo=unpacked, so the debug info was
# never in the binary there. Measured on x86_64-unknown-linux-gnu.
[profile.dev.package."*"]
debug = "line-tables-only"
