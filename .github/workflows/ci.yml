name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # No cache and no dependency fetch: rustfmt parses rather than compiles
      # and `cargo metadata --no-deps` resolves nothing.
      #
      # This crate is a single package with no path dependencies, so `--all`
      # and the scoped form are the same thing here today. The scoped form is
      # used anyway, and this repository is the reason the rest of the estate
      # uses it: `cargo fmt --all` formats the workspace *and the path-based
      # dependencies of its members*, and bti and oxwrt both consume squic by
      # path. A `--all` run from either of them writes 84 sites into this
      # checkout — which is where the 84 sites this commit series just fixed
      # came from being visible in the first place.
      #
      # The package list is derived rather than written out, so a second crate
      # added here cannot go silently unchecked, and is echoed so a green run
      # shows what it covered.
      - name: Format
        run: |
          args=()
          while read -r n; do args+=(-p "$n"); done \
            < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          test ${#args[@]} -gt 0
          echo "checking: ${args[*]}"
          cargo fmt "${args[@]}" -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ring builds from source, so an uncached run is slow enough to
      # discourage anyone from waiting on it.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  cross-impl:
    name: Cross-implementation tests
    runs-on: ubuntu-latest
    steps:
      # Both repos into sibling subdirs so the harness's default
      # SQUIC_RUST_DIR (../squic-rust relative to squic-go) resolves.
      - uses: actions/checkout@v4
        with:
          path: squic-rust
      - uses: actions/checkout@v4
        with:
          repository: wave-cl/squic-go
          path: squic-go

      # squic-rust/rust-toolchain.toml pins the version; cargo auto-installs it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: squic-rust

      - uses: actions/setup-go@v5
        with:
          go-version-file: squic-go/go.mod
          cache: true
          cache-dependency-path: squic-go/go.sum

      # The harness lives in squic-go and drives both probes. It covers the
      # SIP-2 peer key and the SIP-3 peer identity, advertised and anonymous.
      # NOTE: this checks out the sibling repo's default branch, so during a
      # wire flag-day (SIP-3) it fails until BOTH mains carry the change —
      # re-run after the second push.
      - name: Cross-implementation peer-key / peer-identity test
        run: bash squic-go/scripts/cross_peerkey_test.sh

      # Covers the SIP-7 cookie defence across the same matrix: the cookie
      # value, the cookie-reply key, the reply packet and the MAC2 boundary.
      # These are four constructions both ends must compute identically and,
      # until this ran, each had only ever been checked against itself.
      - name: Cross-implementation cookie test
        run: bash squic-go/scripts/cross_cookie_test.sh
